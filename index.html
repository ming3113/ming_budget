<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>동글 가계부 🐷</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#FFD9C9">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="동글 가계부">
<meta name="format-detection" content="telephone=no">
<meta name="app-version" content="1.5.0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFBF5;
  --card:#FFFDF9;
  --line:#F7E8D9;
  --ink:#4A3A35;
  --ink2:#8B776E;
  --ink3:#B9A79D;
  --coral:#FF8A7A;
  --coral-d:#F26C5B;
  --mint:#5FC9B0;
  --sky:#6FC6E8;
  --lav:#C9B8F5;
  --butter:#FFDC9B;
  --r:24px;
  --sh:0 6px 20px rgba(214,170,140,.16);
  --sh-s:0 3px 10px rgba(214,170,140,.13);
  --sab:env(safe-area-inset-bottom,0px);
  --sat:env(safe-area-inset-top,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;min-height:100%}
body{
  font-family:'Gowun Dodum','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',system-ui,sans-serif;
  font-size:15px;line-height:1.5;color:var(--ink);
  background:#FBF1E6;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:contain;
}
body.noscroll{overflow:hidden}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
h1,h2,h3,p{margin:0}
.jua{font-family:'Jua','Gowun Dodum',sans-serif;font-weight:400;letter-spacing:.2px}

/* ── shell ───────────────────────────────── */
#app{
  position:relative;max-width:480px;min-height:100dvh;margin:0 auto;
  display:flex;flex-direction:column;
  background:
    radial-gradient(120% 46% at 50% -8%, #FFEEDC 0%, rgba(255,238,220,0) 62%),
    radial-gradient(90% 34% at 108% 8%, #F1EAFF 0%, rgba(241,234,255,0) 62%),
    radial-gradient(80% 30% at -12% 30%, #EAF7FF 0%, rgba(234,247,255,0) 60%),
    var(--bg);
  box-shadow:0 0 40px rgba(200,160,130,.14);
}
@media(min-width:520px){
  body{background:#F7EADC}
  #app{box-shadow:0 0 60px rgba(160,120,90,.16)}
}

/* ── top bar ─────────────────────────────── */
.topbar{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(12px + var(--sat)) 18px 8px;
  background:linear-gradient(rgba(255,251,245,.94),rgba(255,251,245,.72) 70%,rgba(255,251,245,0));
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.brand{display:flex;align-items:center;gap:9px}
.brand .logo{
  width:36px;height:36px;border-radius:13px;display:block;overflow:hidden;
  box-shadow:0 3px 9px rgba(240,150,120,.26);
}
.brand .logo img{width:100%;height:100%;display:block}
.brand h1{font-size:20px;line-height:1;letter-spacing:.4px}
.iconbtn{
  width:42px;height:42px;border-radius:15px;display:grid;place-items:center;
  font-size:20px;line-height:1;color:var(--ink2);
  background:rgba(255,255,255,.72);border:1px solid #F8EADC;box-shadow:0 2px 6px rgba(214,170,140,.1);
}
.iconbtn:active{transform:scale(.94)}

/* ── month bar ───────────────────────────── */
.monthbar{
  position:sticky;top:calc(56px + var(--sat));z-index:15;
  display:flex;align-items:center;justify-content:center;gap:6px;
  padding:4px 16px 10px;
  background:linear-gradient(rgba(255,251,245,.94),rgba(255,251,245,.82));
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.navbtn{
  width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  font-size:12px;color:var(--ink2);
  background:#fff;border:1px solid #F7E8DA;box-shadow:var(--sh-s);
}
.navbtn:active{transform:scale(.92);background:#FFF6EC}
.monthlabel{
  font-family:'Jua',sans-serif;font-size:19px;padding:4px 10px;min-width:132px;
  border-radius:14px;
}
.monthlabel:active{background:#FFF3E6}
.today-chip{
  font-size:12px;padding:5px 10px;border-radius:99px;color:#C2683F;
  background:#FFE9D6;border:1px solid #FFD8BC;margin-left:2px;
}
.today-chip[hidden]{display:none}

main{flex:1;padding:0 16px calc(112px + var(--sab))}
.view{display:none;animation:fadeUp .24s ease}
.view.on{display:block}
@keyframes fadeUp{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ── summary card ────────────────────────── */
.summary{
  position:relative;overflow:hidden;
  border-radius:var(--r);
  padding:20px 20px 18px;
  background:linear-gradient(145deg,#FFF6E7 0%,#FFEEE3 48%,#FDE9F1 100%);
  border:1px solid #FFE0CE;
  box-shadow:0 8px 24px rgba(230,160,130,.18);
}
.sum-label{font-size:13px;color:#A5785F;display:flex;align-items:center;gap:5px}
.sum-balance{
  font-family:'Jua',sans-serif;font-size:33px;line-height:1.25;margin-top:2px;
  color:#4A3A35;letter-spacing:.3px;word-break:break-all;
}
.sum-balance.neg{color:var(--coral-d)}
.sum-warn{font-size:12px;color:#D06A5A;margin-top:-2px}
.ratio{display:flex;gap:3px;height:9px;margin:14px 0 12px;border-radius:99px;overflow:hidden;background:#fff8}
.ratio i{display:block;border-radius:99px;transition:flex .3s ease}
.ratio .in{background:linear-gradient(90deg,#9BEAD8,#5FC9B0)}
.ratio .ex{background:linear-gradient(90deg,#FFC0AE,#FF8A7A)}
.ratio.zero{background:#F2E5D7}
.ratio.zero i{display:none}
.sum-row{display:flex;gap:10px}
.sum-item{
  flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;font-size:11.5px;color:#96796A;
  background:rgba(255,255,255,.7);border-radius:15px;padding:8px 12px 9px;border:1px solid #fff;
}
.sum-item b{
  font-family:'Jua',sans-serif;font-size:15px;letter-spacing:.2px;line-height:1.35;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.sum-item.income b{color:#2F9E85}
.sum-item.expense b{color:#E2634F}

/* ── generic card ────────────────────────── */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:20px;
  box-shadow:var(--sh-s);
}

/* ── day groups ──────────────────────────── */
.daygroup{margin-top:16px}
.dayhead{display:flex;align-items:baseline;justify-content:space-between;padding:0 6px 7px}
.dayhead .d{font-family:'Jua',sans-serif;font-size:15px;color:#6B564C}
.dayhead .d em{font-style:normal;color:var(--ink3);font-size:12.5px;margin-left:3px}
.dayhead .dt{font-size:12px;color:var(--ink3);display:flex;gap:7px}
.dayhead .dt .i{color:#2F9E85}
.dayhead .dt .e{color:#D9725F}
.list{padding:4px 0;overflow:hidden}
.entry{
  position:relative;display:flex;align-items:center;gap:11px;width:100%;
  padding:11px 15px;text-align:left;
}
.entry:active{background:#FFF7EE}
.entry+.entry::before{content:'';position:absolute;left:15px;right:15px;top:0;height:1px;background:#F8EFE3}
.cat-ic{
  flex:none;width:38px;height:38px;border-radius:14px;display:grid;place-items:center;
  font-size:19px;line-height:1;
}
.entry-mid{min-width:0;flex:1;display:flex;flex-direction:column;gap:1px}
.entry-cat{font-size:14.5px;color:#584640;line-height:1.3}
.entry-memo{font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry-amt{
  flex:none;font-family:'Jua',sans-serif;font-size:15px;letter-spacing:.2px;white-space:nowrap;
}
.entry-amt.ex{color:#E2634F}
.entry-amt.in{color:#2F9E85}

/* ── empty ───────────────────────────────── */
.empty{padding:40px 20px 30px;text-align:center;animation:fadeUp .3s ease}
.empty-pig{font-size:56px;line-height:1;filter:saturate(.9)}
.empty-t{font-family:'Jua',sans-serif;font-size:16px;margin-top:12px;color:#6B564C}
.empty-s{font-size:13px;color:var(--ink3);margin-top:5px}
.empty-s b{color:var(--coral-d)}

/* ── stats ───────────────────────────────── */
.seg{
  display:flex;gap:4px;padding:4px;margin:2px 0 14px;
  background:#FFF1E3;border:1px solid #FFE4CE;border-radius:16px;
}
.seg button{
  flex:1;padding:9px 0;border-radius:12px;font-family:'Jua',sans-serif;font-size:14px;
  color:#A98B77;transition:.18s;
}
.seg button.on{background:#fff;color:#4A3A35;box-shadow:0 2px 7px rgba(214,150,120,.18)}
.donut-card{display:grid;place-items:center;padding:22px 16px 20px;position:relative;overflow:hidden}
.donut-card .spark{position:absolute;font-size:15px;opacity:.5}
.donut{
  position:relative;width:186px;height:186px;border-radius:50%;
  background:#F8ECDF;
  box-shadow:inset 0 0 0 1px #FFF6EC, 0 8px 22px rgba(214,160,130,.16);
  transition:background .3s ease;
}
.donut-hole{
  position:absolute;inset:30px;border-radius:50%;background:#FFFDF9;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  box-shadow:0 2px 10px rgba(214,160,130,.12);
}
.donut-hole span{font-size:11.5px;color:var(--ink3)}
.donut-hole b{font-family:'Jua',sans-serif;font-size:21px;font-weight:400;color:#4A3A35;letter-spacing:.2px}
.donut-cap{font-size:12px;color:var(--ink3);margin-top:14px}
.rank-card{padding:6px 16px 8px;margin-top:14px}
.rank-top-line{
  font-size:12.5px;color:#8A6E60;background:#FFF5E9;border-radius:13px;
  padding:9px 12px;margin:10px 0 4px;border:1px solid #FFEBD6;
}
.rank-top-line b{color:#4A3A35;font-weight:400}
.rank{display:flex;align-items:center;gap:11px;padding:11px 0}
.rank+.rank{border-top:1px dashed #F7EADB}
.rank .cat-ic{width:34px;height:34px;font-size:17px;border-radius:12px}
.rank-mid{flex:1;min-width:0}
.rank-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.rank-name{font-size:13.5px;color:#584640;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-amt{font-family:'Jua',sans-serif;font-size:14px;color:#4A3A35;white-space:nowrap}
.bar{height:7px;border-radius:99px;background:#FAF0E4;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .45s cubic-bezier(.2,.8,.3,1)}
.rank-pct{
  flex:none;width:38px;text-align:right;font-family:'Jua',sans-serif;font-size:12.5px;color:#A98B77;
}
.rank-empty{padding:26px 8px 30px;text-align:center;color:var(--ink3);font-size:13px}

/* ── tab bar ─────────────────────────────── */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  width:100%;max-width:480px;margin:0 auto;
  display:grid;grid-template-columns:1fr 78px 1fr;align-items:end;
  padding:7px 20px calc(7px + var(--sab));
  background:rgba(255,252,246,.94);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid #F8EADC;
  box-shadow:0 -4px 20px rgba(214,170,140,.1);
}
.tab{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:4px 0 2px;font-family:'Jua',sans-serif;font-size:12px;color:#BBA99F;
  transition:color .15s, transform .15s;
}
.tab .ti{font-size:19px;line-height:1;filter:grayscale(.55);opacity:.75;transition:.15s}
.tab.on{color:var(--coral-d)}
.tab.on .ti{filter:none;opacity:1;transform:translateY(-1px)}
.fab{
  justify-self:center;width:62px;height:62px;border-radius:24px;
  display:grid;place-items:center;font-size:32px;line-height:1;color:#fff;
  font-family:'Jua',sans-serif;padding-bottom:4px;
  background:linear-gradient(150deg,#FFA98F,#FF7F6E 60%,#F9695F);
  box-shadow:0 8px 18px rgba(244,110,95,.4), inset 0 1px 0 rgba(255,255,255,.55);
  transform:translateY(-12px);
  transition:transform .15s ease;
}
.fab:active{transform:translateY(-9px) scale(.95)}

/* ── sheets ──────────────────────────────── */
.sheet-wrap{position:fixed;inset:0;z-index:60;pointer-events:none}
.sheet-wrap.on{pointer-events:auto}
.sheet-backdrop{
  position:absolute;inset:0;background:rgba(72,52,46,.3);
  opacity:0;transition:opacity .24s ease;
  backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
}
.sheet-wrap.on .sheet-backdrop{opacity:1}
.sheet{
  position:absolute;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;
  max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;
  background:#FFFCF7;
  border-radius:30px 30px 0 0;
  padding:8px 18px calc(20px + var(--sab));
  box-shadow:0 -10px 40px rgba(120,80,60,.22);
  transform:translateY(102%);
  transition:transform .3s cubic-bezier(.22,.85,.3,1);
}
.sheet-wrap.on .sheet{transform:none}
.grab{width:42px;height:5px;border-radius:99px;background:#F0DDCC;margin:2px auto 10px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sheet-head h2{font-family:'Jua',sans-serif;font-size:19px;font-weight:400}
.xbtn{
  width:36px;height:36px;border-radius:50%;display:grid;place-items:center;
  font-size:15px;color:#A98B77;background:#FFF3E6;border:1px solid #FBE7D5;
}
.xbtn:active{transform:scale(.94)}

.type-toggle{display:flex;gap:6px;padding:4px;background:#FFF1E3;border:1px solid #FFE4CE;border-radius:16px}
.type-toggle button{
  flex:1;padding:10px 0;border-radius:12px;font-family:'Jua',sans-serif;font-size:14.5px;color:#A98B77;
  transition:.18s;
}
.type-toggle button.on{background:#fff;box-shadow:0 2px 8px rgba(214,150,120,.18)}
.type-toggle button[data-t="expense"].on{color:#E2634F}
.type-toggle button[data-t="income"].on{color:#2F9E85}

.field-label{display:block;font-size:12.5px;color:#A98B77;margin:16px 0 7px;padding-left:3px}
.amt-box{
  display:flex;align-items:center;gap:8px;padding:12px 16px;
  background:#fff;border:2px solid #FFE3CE;border-radius:20px;
  box-shadow:0 3px 10px rgba(214,170,140,.08);
}
.amt-box:focus-within{border-color:#FFC3A6;box-shadow:0 0 0 4px #FFF1E4}
.amt{
  flex:1;min-width:0;border:0;outline:0;background:transparent;text-align:right;
  font-family:'Jua',sans-serif;font-size:30px;line-height:1.2;color:#4A3A35;padding:0;
}
.amt::placeholder{color:#E6D3C2}
.amt-box .w{font-family:'Jua',sans-serif;font-size:17px;color:#A98B77;padding-bottom:3px}
.chips{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.chips button{
  flex:1;min-width:56px;padding:9px 0;border-radius:13px;font-family:'Jua',sans-serif;font-size:13px;
  color:#8B6A57;background:#FFF3E5;border:1px solid #FFE5CF;
}
.chips button:active{transform:scale(.96);background:#FFEAD8}
.chips button.clear{color:#B99A86;background:#FAF2E9;border-color:#F3E6DA;flex:.8}

.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.cat{
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 7px;
  border-radius:15px;background:#FFF9F1;border:1.5px solid #F9EBDB;transition:.14s;
}
.cat .ce{font-size:19px;line-height:1}
.cat .cn{font-size:10.5px;color:#8B776E;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat.on{background:#FFEFE2;border-color:#FFC6A8;box-shadow:0 3px 9px rgba(240,150,120,.16)}
.cat.on .cn{color:#B55C3C;font-weight:400}
.cat:active{transform:scale(.96)}

.row2{display:flex;gap:9px;align-items:flex-end}
.fld{flex:1;min-width:0}
.fld>label{display:block;font-size:12.5px;color:#A98B77;margin:16px 0 7px;padding-left:3px}
.date-in,.text-in{
  width:100%;min-width:0;padding:12px 13px;border-radius:16px;background:#fff;
  border:1.5px solid #F9E7D6;outline:0;font-size:15px;color:#4A3A35;
}
.text-in::placeholder{color:#DCC9B9}
.date-in:focus,.text-in:focus{border-color:#FFC9AC;box-shadow:0 0 0 4px #FFF2E7}
.date-field{
  position:relative;display:flex;align-items:center;gap:6px;
  padding:12px 13px;border-radius:16px;background:#fff;
  border:1.5px solid #F9E7D6;overflow:hidden;
}
.date-field:focus-within{border-color:#FFC9AC;box-shadow:0 0 0 4px #FFF2E7}
.date-field .df-val{
  flex:1;min-width:0;font-size:14.5px;color:#4A3A35;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.date-field .df-ico{font-size:15px;opacity:.75;line-height:1}
.date-native{
  position:absolute;inset:0;width:100%;height:100%;opacity:0;
  border:0;padding:0;margin:0;cursor:pointer;-webkit-appearance:none;appearance:none;
}
.day-quick{display:flex;gap:6px;padding-bottom:1px}
.day-quick button{
  padding:11px 12px;border-radius:14px;font-size:12.5px;color:#8B6A57;
  background:#FFF3E5;border:1px solid #FFE5CF;white-space:nowrap;
}
.day-quick button:active{background:#FFEAD8}

.sheet-actions{display:flex;gap:9px;margin-top:22px}
.sheet-actions button{
  flex:1;padding:15px 0;border-radius:18px;font-family:'Jua',sans-serif;font-size:16px;
}
.btn-primary{
  color:#fff;background:linear-gradient(150deg,#FFA18C,#FF7F6E 55%,#F9695F);
  box-shadow:0 6px 16px rgba(244,110,95,.32), inset 0 1px 0 rgba(255,255,255,.4);
}
.btn-primary:active{transform:translateY(1px) scale(.99)}
.btn-ghost{color:#8B6A57;background:#FFF3E5;border:1px solid #FFE5CF}
.btn-del{
  flex:.72 !important;color:#E2634F;background:#FFF0EC;border:1px solid #FFDCD3;
}

/* menu sheet */
.menu-item{
  display:flex;align-items:center;gap:11px;width:100%;padding:15px 14px;
  border-radius:16px;background:#FFF8F0;border:1px solid #FAEBDA;margin-bottom:8px;
  font-size:14.5px;color:#584640;text-align:left;
}
.menu-item .mi{font-size:18px;line-height:1;width:22px;text-align:center}
.menu-item small{display:block;font-size:11.5px;color:var(--ink3);margin-top:1px}
.menu-item:active{background:#FFEFE1}
.menu-item.danger{color:#D9584A;background:#FFF3EF;border-color:#FFE0D7}
.menu-note{font-size:11.5px;color:var(--ink3);text-align:center;margin-top:10px;line-height:1.6}

/* category editor */
.cat-row{display:flex;gap:6px;align-items:center;padding:4px 5px;margin-bottom:3px;position:relative;border-radius:16px;
  transition:transform .2s cubic-bezier(.2,.8,.3,1)}
.cat-row.dragging{
  transition:none;z-index:7;cursor:grabbing;
  background:#FFF6EC;outline:2px solid #FFD3B8;outline-offset:1px;
  box-shadow:0 12px 26px rgba(206,146,116,.30);
}
.cat-row.dragging .emo,.cat-row.dragging .nm{background:#FFFDF8;border-color:#FCDCC4}
.cat-row .grip{
  width:26px;align-self:stretch;flex:none;display:grid;place-items:center;
  color:#D5A991;font-size:15px;line-height:1;border-radius:12px;
  touch-action:none;cursor:grab;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  transition:color .15s,background .15s;
}
.cat-row .grip:active,.cat-row.dragging .grip{color:#B98164;background:#FFEFE2}
.cat-row .grip:focus-visible{outline:2px solid #FFD3B8;outline-offset:1px}
#catList.is-dragging,#catList.is-dragging *{-webkit-user-select:none;user-select:none}
.cat-row.press-armed{background:#FFF6EC}
.cat-row .emo{

<noscript><p style="padding:24px;text-align:center">이 가계부를 쓰려면 브라우저에서 자바스크립트를 켜 주세요!</p></noscript>

<script>
(function(){
'use strict';

/* ── basics ─────────────────────────────── */
var LS='ming.budget.v1';
var $=function(s,r){return (r||document).querySelector(s);};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
var pad=function(n){return String(n).padStart(2,'0');};
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var fmt=function(n){return Number(n||0).toLocaleString('ko-KR');};
var won=function(n){return fmt(n)+'원';};

var NOW=new Date();
var TODAY=NOW.getFullYear()+'-'+pad(NOW.getMonth()+1)+'-'+pad(NOW.getDate());
var THIS_MONTH=TODAY.slice(0,7);

var WD=['일','월','화','수','목','금','토'];
var PALETTE=['#FFB3A7','#F6C79B','#A9D8F0','#F5B7D0','#C9B8F5','#9FE0C8','#FFD98E','#B9C9F0','#D8CFC4','#FFC7A8'];
var UNKNOWN={name:'기타',emoji:'🎁',color:'#D8CFC4'};

/* ── data ───────────────────────────────── */
function defaultCats(){
  var e=[['식비','🍚','#FFB3A7'],['카페·간식','☕','#F6C79B'],['교통','🚌','#A9D8F0'],['쇼핑','🛍️','#F5B7D0'],['여가·문화','🎬','#C9B8F5'],['건강·병원','🏥','#9FE0C8'],['생활·고정비','🏠','#FFD98E'],['기타','🎁','#D8CFC4']];
  var i=[['월급','💰','#7FD6C0'],['부수입·용돈','✨','#9AD9F2'],['기타','🎁','#B9C9F0']];
  function mk(arr,p){return arr.map(function(c,k){return {id:p+(k+1),name:c[0],emoji:c[1],color:c[2]};});}
  return {expense:mk(e,'e'),income:mk(i,'i')};
}
function defaultWallets(){
  return [
    {id:'cash',group:'cash',name:'현금',emoji:'💵',initialBalance:0,includeInTotal:true},
    {id:'bank',group:'bank',name:'기본 계좌',emoji:'🏦',initialBalance:0,includeInTotal:true}
  ];
}
function freshState(){return {v:3,cats:defaultCats(),wallets:defaultWallets(),items:[]};}

function cleanCats(list){
  if(!Array.isArray(list)) return [];
  return list.filter(function(c){return c&&typeof c==='object';}).map(function(c){
    return {
      id:String(c.id||uid()),
      name:String(c.name||'이름없음').slice(0,14),
      emoji:String(c.emoji||'🎁').slice(0,8),
      color:/^#[0-9a-fA-F]{6}$/.test(String(c.color))?String(c.color):'#D8CFC4'
    };
  });
}
/* 지갑은 '현금(단독)'과 '계좌(큰 그룹 + 세부 항목)'로 나뉩니다.
   group: 'cash' | 'bank' — group이 없는 예전 데이터는 id:'cash'만 현금,
   나머지(기본 '계좌'·사용자가 추가한 지갑)는 모두 계좌 세부 항목으로 편입됩니다. */
function cleanWallets(list){
  var out=[], alias={};
  if(Array.isArray(list)) list.forEach(function(w){
    if(!w||typeof w!=='object') return;
    var id=String(w.id||uid());
    if(!id||out.some(function(x){return x.id===id;})) return;
    var grp=(w.group==='cash'||w.group==='bank')?w.group:(id==='cash'?'cash':'bank');
    out.push({
      id:id,
      group:grp,
      name:String(w.name||'').trim().slice(0,10)||(grp==='cash'?'현금':'계좌'),
      emoji:String(w.emoji||'').slice(0,8)||(grp==='cash'?'💵':'🏦'),
      initialBalance:Math.round(Number(w.initialBalance)||0),
      /* 재산 포함 여부 — 없던 예전 데이터는 모두 포함(true)으로 읽는다 */
      includeInTotal:w.includeInTotal!==false
    });
  });
  if(!out.length) return {wallets:defaultWallets(),alias:alias};
  // 💵 현금은 단 하나 — 첫 번째만 남기고 나머지는 계좌로
  var cash=null;
  out.forEach(function(w){
    if(w.group!=='cash') return;
    if(cash) { w.group='bank'; return; }
    cash=w;
  });
  if(!cash){
    cash={id:'cash',group:'cash',name:'현금',emoji:'💵',initialBalance:0,includeInTotal:true};
    out.unshift(cash);
  }else{
    cash.name='현금'; cash.emoji='💵';
    if(cash.id!=='cash'&&!out.some(function(w){return w.id==='cash';})){
      alias[cash.id]='cash'; cash.id='cash';
    }
  }
  // 🏦 계좌는 항상 하나 이상
  if(!out.some(function(w){return w.group==='bank';})){
    out.push({id:out.some(function(w){return w.id==='bank';})?uid():'bank',
      group:'bank',name:'기본 계좌',emoji:'🏦',initialBalance:0,includeInTotal:true});
  }
  // 옛 기본 '계좌' 이름을 '기본 계좌'로 다듬기 (잔액·기록은 그대로)
  out.forEach(function(w){
    if(w.group!=='bank') return;
    if(w.id==='bank'&&w.name==='계좌') w.name='기본 계좌';
    if(!w.emoji) w.emoji='🏦';
  });
  return {wallets:out,alias:alias};
}
/* 결제 방식: 💵 현금(cash) · 🏦 계좌이체(transfer) · 💳 체크카드(debit) · 💳 신용카드(credit)
   예전 기록은 현금 지갑에서 빠졌으면 'cash', 계좌 기록이면 'transfer'로 읽어 그대로 살립니다.
   신용카드는 잔액에서 바로 빠지지 않으므로 walletId가 없습니다(null). */
function isPay(p){ return p==='cash'||p==='transfer'||p==='debit'||p==='credit'; }
function payPack(x,wid,wgroup,cashId,bankFallback){
  var p=String(x.payMethod||'');
  if(x.type==='income'){
    if(p!=='cash'&&p!=='transfer') p=(wgroup[wid]==='cash')?'cash':'transfer';
    return {payMethod:p, walletId:p==='cash'?cashId:(wgroup[wid]==='bank'?wid:bankFallback)};
  }
  if(!isPay(p)) p=(wgroup[wid]==='cash')?'cash':'transfer';
  if(p==='credit') return {payMethod:'credit', walletId:null};
  if(p==='cash') return {payMethod:'cash', walletId:cashId};
  return {payMethod:p, walletId:(wgroup[wid]==='bank'?wid:bankFallback)};
}
function normalize(d){
  if(!d||typeof d!=='object'||!d.cats||typeof d.cats!=='object') return null;
  var exp=cleanCats(d.cats.expense), inc=cleanCats(d.cats.income);
  var cw=cleanWallets(d.wallets), wallets=cw.wallets, alias=cw.alias;
  var wids=wallets.map(function(w){return w.id;});
  var bankIds=wallets.filter(function(w){return w.group==='bank';}).map(function(w){return w.id;});
  var fallback=bankIds.indexOf('bank')>-1?'bank':(bankIds[0]||wids[0]);
  var cashId=(wallets.filter(function(w){return w.group==='cash';})[0]||{}).id;
  var wgroup={}; wallets.forEach(function(w){ wgroup[w.id]=w.group; });
  var items=Array.isArray(d.items)?d.items.filter(function(x){
    return x && typeof x.amount==='number' && x.amount>0 &&
      /^\d{4}-\d{2}-\d{2}$/.test(String(x.date)) &&
      (x.type==='expense'||x.type==='income'||x.type==='transfer');
  }).map(function(x){
    if(x.type==='transfer'){
      /* 🔄 이동(이체): 출금 지갑 → 입금 지갑. 지갑이 사라졌거나 같은 곳이면 버린다 */
      var f=String(x.fromWalletId||''), t=String(x.toWalletId||'');
      if(alias[f]) f=alias[f];
      if(alias[t]) t=alias[t];
      if(wids.indexOf(f)===-1||wids.indexOf(t)===-1||f===t) return null;
      return {
        id:String(x.id||uid()),
        date:String(x.date),
        type:'transfer',
        amount:Math.round(x.amount),
        fromWalletId:f,
        toWalletId:t,
        walletId:null,
        payMethod:null,
        cat:'',
        memo:String(x.memo||'').slice(0,60),
        createdAt:Number(x.createdAt)||Date.now()
      };
    }
    var wid=String(x.walletId||'');
    if(alias[wid]) wid=alias[wid];
    if(wids.indexOf(wid)===-1) wid='';
    var pack=payPack(x,wid,wgroup,cashId,fallback);
    return {
      id:String(x.id||uid()),
      date:String(x.date),
      type:x.type,

    };
  }).filter(Boolean):[];
  if(!exp.length){exp=defaultCats().expense;}

  return {v:3,cats:{expense:exp,income:inc},wallets:wallets,items:items};
}

/* ── wallets ────────────────────────────── */
function walletById(id){
  return state.wallets.find(function(w){return w.id===id;})||null;
}
function cashWallet(){
  return state.wallets.find(function(w){return w.group==='cash';})||null;
}
function bankWallets(){
  return state.wallets.filter(function(w){return w.group==='bank';});
}
function walletOf(it){
  if(it&&it.payMethod==='credit') return null;
  return walletById(it.walletId)||bankWallets()[0]||state.wallets[0];
}
function payOf(it){
  if(it&&isPay(it.payMethod)) return it.payMethod;
  var w=walletById(it&&it.walletId);
  return (w&&w.group==='cash')?'cash':'transfer';
}
function payBadge(it){
  var p=payOf(it), many=bankWallets().length>1, w=walletById(it.walletId);
  if(p==='cash') return '💵 현금';
  if(p==='credit') return '💳 신용카드';
  if(p==='debit') return (many&&w)?('💳 체크 · '+w.name):'💳 체크카드';
  return (many&&w)?('🏦 계좌이체 · '+w.name):'🏦 계좌이체';
}
function walletNet(id){
  var n=0;
  state.items.forEach(function(it){
    if(it.type==='transfer'){
      if(it.fromWalletId===id) n-=it.amount;
      if(it.toWalletId===id) n+=it.amount;
      return;
    }
    if(it.walletId===id) n+=(it.type==='income'?it.amount:-it.amount);
  });
  return n;
}
function walletBal(w){
  if(!w) return 0;
  return Math.round(Number(w.initialBalance)||0)+walletNet(w.id);
}
function isInTotal(w){ return !w || w.includeInTotal!==false; }
function groupBal(group){
  return state.wallets.reduce(function(s,w){ return w.group===group?s+walletBal(w):s; },0);
}
/* 계좌 총합·전체 잔액에는 '재산 포함'인 지갑만 들어간다 */
function sumBal(list){
  return list.reduce(function(s,w){ return isInTotal(w)?s+walletBal(w):s; },0);
}
function totalBal(){
  return sumBal(state.wallets);
}
function walletLabel(w){
  if(!w) return '';
  if(w.group==='cash') return '💵 현금';
  return bankWallets().length>1 ? '🏦 '+w.name : '🏦 계좌';
}

function filterHTML(hasItems){

function filterValid(f){
  if(f==='all') return true;
  if(f==='credit') return true;
  if(f.indexOf('g:')===0) return f.slice(2)==='cash'||f.slice(2)==='bank';
  if(f.indexOf('w:')===0) return !!walletById(f.slice(2));
  return false;
}
function inFilter(it,f){
  if(f==='all') return true;
  if(f==='credit') return it.type!=='transfer'&&payOf(it)==='credit';
  if(it.type==='transfer'){
    if(f.indexOf('g:')===0){
      var g=f.slice(2);
      var a=walletById(it.fromWalletId), b=walletById(it.toWalletId);
      return !!((a&&a.group===g)||(b&&b.group===g));
    }
    return it.fromWalletId===f.slice(2)||it.toWalletId===f.slice(2);
  }
  var w=walletOf(it);
  if(f.indexOf('g:')===0) return !!w && w.group===f.slice(2);
  return it.walletId===f.slice(2);
}

function groupCats(items,type){
  var map={}, rows=[];
  items.forEach(function(it){
    var c=catView(it);
    var k=c.id;
    if(!map[k]){ map[k]={id:k,name:c.name,emoji:c.emoji,color:c.color,amount:0}; rows.push(map[k]); }
    map[k].amount+=it.amount;
  });
  rows.sort(function(a,b){return b.amount-a.amount;});
  var total=rows.reduce(function(s,r){return s+r.amount;},0);
  rows.forEach(function(r){ r.pct=total?(r.amount/total*100):0; });
  return {rows:rows,total:total};
}

var toastTimer=null, toastAction=null;
function toast(msg,actionLabel,actionFn){
  var el=$('#toast'), btn=$('#toastBtn');
  $('#toastMsg').textContent=msg;
  toastAction=actionFn||null;
  if(actionLabel&&actionFn){ btn.hidden=false; btn.textContent=actionLabel; }
  else btn.hidden=true;

  toastTimer=setTimeout(function(){ el.classList.remove('on'); toastAction=null; }, actionFn?5000:2000);
}

/* ── sheet engine ───────────────────────── */
var sheetEl=null, sheetCloseTimer=null;
function openSheet(html,onOpen){
  closeSheet(true);
  clearTimeout(sheetCloseTimer);
  Array.prototype.forEach.call(document.querySelectorAll('.sheet-wrap'),function(el){ el.remove(); });
  var wrap=document.createElement('div');
  wrap.className='sheet-wrap';
  wrap.innerHTML='<div class="sheet-backdrop"></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>'+html+'</div>';
  document.body.appendChild(wrap);
  sheetEl=wrap;
  document.body.classList.add('noscroll');
  wrap.querySelector('.sheet-backdrop').addEventListener('click',function(){ closeSheet(); });
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ wrap.classList.add('on'); }); });
  if(onOpen) onOpen(wrap);
}
function closeSheet(immediate){
  if(!sheetEl) return;
  if(typeof catAbort==='function') catAbort();
  var el=sheetEl; sheetEl=null;
  el.classList.remove('on');
  document.body.classList.remove('noscroll');
  if(immediate){ el.remove(); return; }
  clearTimeout(sheetCloseTimer);
  sheetCloseTimer=setTimeout(function(){ if(el.parentNode) el.remove(); },320);
}
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeSheet(); });

  }
  if(draft.type==='income'){
    var ih='<label class="field-label">입금처</label><div class="wchips">';
    if(cash){
      ih+='<button type="button" data-w="'+esc(cash.id)+'" class="'+(draft.pay==='cash'?'on':'')+'">💵 현금</button>';
    }
    if(banks.length===1){
      ih+='<button type="button" data-w="'+esc(banks[0].id)+'" class="'+(draft.pay!=='cash'?'on':'')+'">🏦 계좌</button>';
    }else{
      ih+='<span class="wbank"><span class="wbank-label">🏦 계좌</span>'+
        banks.map(function(w){
          return '<button type="button" data-w="'+esc(w.id)+'" class="'+(draft.pay!=='cash'&&w.id===draft.acct?'on':'')+'">'+esc(w.emoji)+' '+esc(w.name)+'</button>';
        }).join('')+'</span>';
    }
    return ih+'</div>';
  }
  var html='<label class="field-label">결제 방법</label>'+
    '<div class="wchips pmchips">'+
      '<button type="button" data-pay="cash" class="'+(draft.pay==='cash'?'on':'')+'">💵 현금</button>'+
      '<button type="button" data-pay="transfer" class="'+(draft.pay==='transfer'?'on':'')+'">🏦 계좌이체</button>'+
      '<button type="button" data-pay="debit" class="'+(draft.pay==='debit'?'on':'')+'">💳 체크카드</button>'+
      '<button type="button" data-pay="credit" class="'+(draft.pay==='credit'?'on':'')+'">💳 신용카드</button>'+
    '</div>';
  if(draft.pay==='transfer'||draft.pay==='debit'){
    html+='<label class="field-label">어느 계좌에서 빠져나가나요?</label><div class="wchips">'+
      (banks.length===1
        ? '<button type="button" data-acct="'+esc(banks[0].id)+'" class="on">'+esc(banks[0].emoji)+' '+esc(banks[0].name)+'</button>'
        : banks.map(function(w){
            return '<button type="button" data-acct="'+esc(w.id)+'" class="'+(w.id===draft.acct?'on':'')+'">'+esc(w.emoji)+' '+esc(w.name)+'</button>';
          }).join(''))+
      '</div>';
  }else if(draft.pay==='credit'){
    html+='<p class="hint pm">계좌 잔액은 바로 빠지지 않고 이번 달 지출에만 기록돼요.</p>';
  }
  return html;
}
/* 저장할 지갑·결제 방식 정리: 신용카드는 잔액을 건드리지 않는다 */
function resolvePay(){
  var banks=bankWallets(), cash=cashWallet();
  function pickBank(){
    var w=walletById(draft.acct);
    if(!w||w.group!=='bank') w=banks[0]||state.wallets[0];
    return w?w.id:null;
  }
  if(draft.type==='income'){
    if(draft.pay==='cash') return {payMethod:'cash', walletId:cash?cash.id:null};
    return {payMethod:'transfer', walletId:pickBank()};
  }
  if(draft.pay==='credit') return {payMethod:'credit', walletId:null};
  if(draft.pay==='cash') return {payMethod:'cash', walletId:cash?cash.id:null};
  return {payMethod:draft.pay==='debit'?'debit':'transfer', walletId:pickBank()};
}
function defaultFromTo(){
  var banks=bankWallets();
  var from=(banks[0]||state.wallets[0]||{}).id||null;
  var to=null;
  for(var i=0;i<state.wallets.length;i++){
    if(state.wallets[i].id!==from){ to=state.wallets[i].id; break; }
  }
  return {from:from,to:to};
}
function openEntrySheet(id){
  var it=id?state.items.find(function(x){return x.id===id;}):null;
  var defDate;
  if(it) defDate=it.date;
  else defDate=(view.month===THIS_MONTH)?TODAY:(view.month+'-01');
  var defBank=(bankWallets()[0]||{}).id;
  if(it&&it.type==='transfer'){
    draft={
      id:it.id,type:'transfer',amount:it.amount,cat:'',date:it.date,memo:it.memo,
      pay:'transfer',acct:defBank,from:it.fromWalletId,to:it.toWalletId
    };
  }else if(it){
    var itw=walletById(it.walletId);
    draft={
      id:it.id,type:it.type,amount:it.amount,cat:it.cat,date:it.date,memo:it.memo,
      pay:payOf(it),
      acct:(itw&&itw.group==='bank')?itw.id:defBank,
      from:null,to:null
    };
  }else{
    var ft0=defaultFromTo();
    draft={id:null,type:'expense',amount:0,cat:(state.cats.expense[0]||{}).id,date:defDate,memo:'',
       pay:'transfer',acct:defBank,from:ft0.from,to:ft0.to};
  }
  if(draft.type==='expense'&&!state.cats.expense.some(function(c){return c.id===draft.cat;}))
    draft.cat=(state.cats.expense[0]||{}).id;
  if(draft.type==='income'&&!state.cats.income.some(function(c){return c.id===draft.cat;}))
    draft.cat=(state.cats.income[0]||{}).id;

  openSheet(
    '<div class="sheet-head"><h2>'+(it?'기록 고치기':'오늘의 기록')+'</h2><button class="xbtn" data-close>✕</button></div>'+
    '<div class="type-toggle" id="typeToggle">'+
      '<button type="button" data-t="expense" class="'+(draft.type==='expense'?'on':'')+'">💸 지출</button>'+
      '<button type="button" data-t="income" class="'+(draft.type==='income'?'on':'')+'">💵 수입</button>'+
      '<button type="button" data-t="transfer" class="'+(draft.type==='transfer'?'on':'')+'">🔄 이동</button>'+
    '</div>'+
    '<label class="field-label" for="amtInput" id="amtLabel">'+(draft.type==='transfer'?'얼마를 옮겼어요?':'얼마였어요?')+'</label>'+
    '<div class="amt-box"><input id="amtInput" class="amt" type="text" inputmode="numeric" autocomplete="off" placeholder="0" value="'+(draft.amount?fmt(draft.amount):'')+'"><span class="w">원</span></div>'+
    '<div class="chips">'+
      '<button type="button" data-add="1000">+1천</button>'+
      '<button type="button" data-add="5000">+5천</button>'+
      '<button type="button" data-add="10000">+1만</button>'+
      '<button type="button" data-add="50000">+5만</button>'+
      '<button type="button" class="clear" data-clear="1">지우기</button>'+
    '</div>'+
    '<div id="catSection"'+(draft.type==='transfer'?' hidden':'')+'>'+
      '<label class="field-label" id="catLabel">'+(draft.type==='income'?'어디서 받았어요?':'어디에 썼어요?')+'</label>'+
      '<div class="cat-grid" id="catGrid">'+(draft.type==='transfer'?'':catGridHTML(draft.type,draft.cat))+'</div>'+
    '</div>'+
    '<div id="payArea">'+payAreaHTML()+'</div>'+
    '<div class="row2">'+
      '<div class="fld"><label for="dateInput">날짜</label>'+
        '<div class="date-field">'+
          '<span class="df-val" id="dateDisp">'+dateDisp(draft.date)+'</span><span class="df-ico">📅</span>'+
          '<input id="dateInput" class="date-native" type="date" value="'+draft.date+'" aria-label="날짜">'+
        '</div></div>'+
      '<div class="day-quick"><button type="button" data-day="today">오늘</button><button type="button" data-day="yesterday">어제</button></div>'+
    '</div>'+
    '<label class="field-label" for="memoInput">메모 (선택)</label>'+
    '<input id="memoInput" class="text-in" type="text" maxlength="60" placeholder="'+(draft.type==='transfer'?'예) 카카오페이 충전':'예) 김밥천국 점심')+'" value="'+esc(draft.memo)+'">'+
    '<div class="sheet-actions">'+
      (it?'<button type="button" class="btn-del" id="delBtn">삭제</button>':'')+
      '<button type="button" class="btn-primary" id="saveBtn"> 저장하기</button>'+
    '</div>',
    function(wrap){
      wrap.querySelector('[data-close]').addEventListener('click',function(){ closeSheet(); });
      var amtEl=wrap.querySelector('#amtInput');
      var gridEl=wrap.querySelector('#catGrid');
      var catSec=wrap.querySelector('#catSection');
      var catLabel=wrap.querySelector('#catLabel');
      var amtLabel=wrap.querySelector('#amtLabel');
      var dateEl=wrap.querySelector('#dateInput');
      var payArea=wrap.querySelector('#payArea');
      function renderPay(){ payArea.innerHTML=payAreaHTML(); }

      wrap.querySelector('#typeToggle').addEventListener('click',function(e){
        var b=e.target.closest('button[data-t]'); if(!b) return;
        if(b.dataset.t===draft.type) return;
        draft.type=b.dataset.t;
        $$('#typeToggle button',wrap).forEach(function(x){x.classList.toggle('on',x.dataset.t===draft.type);});
        catSec.hidden=(draft.type==='transfer');
        amtLabel.textContent=(draft.type==='transfer')?'얼마를 옮겼어요?':'얼마였어요?';
        wrap.querySelector('#memoInput').placeholder=(draft.type==='transfer')?'예) 카카오페이 충전':'예) 김밥천국 점심';
        if(draft.type==='transfer'){
          if(!walletById(draft.from)||!walletById(draft.to)||draft.from===draft.to){
            var ft=defaultFromTo(); draft.from=ft.from; draft.to=ft.to;
          }
          renderPay(); return;
        }
        if(!state.cats[draft.type].some(function(c){return c.id===draft.cat;})) draft.cat=(state.cats[draft.type][0]||{}).id;
        gridEl.innerHTML=catGridHTML(draft.type,draft.cat);
        catLabel.textContent=draft.type==='income'?'어디서 받았어요?':'어디에 썼어요?';
        if(draft.type==='income'&&(draft.pay==='debit'||draft.pay==='credit')) draft.pay='transfer';
        if(draft.pay!=='cash'&&!bankWallets().some(function(w){return w.id===draft.acct;}))
          draft.acct=(bankWallets()[0]||{}).id;
        renderPay();
      });
      gridEl.addEventListener('click',function(e){
        var b=e.target.closest('.cat'); if(!b) return;
        draft.cat=b.dataset.cat;
        $$('.cat',gridEl).forEach(function(x){x.classList.toggle('on',x.dataset.cat===draft.cat);});
      });
      payArea.addEventListener('click',function(e){
        var b=e.target.closest('button'); if(!b) return;
        if(b.dataset.from){ draft.from=b.dataset.from; renderPay(); return; }
        if(b.dataset.to){ draft.to=b.dataset.to; renderPay(); return; }
        if(b.dataset.pay){
          draft.pay=b.dataset.pay;
          if((draft.pay==='transfer'||draft.pay==='debit')&&!bankWallets().some(function(w){return w.id===draft.acct;}))
            draft.acct=(bankWallets()[0]||{}).id;
          renderPay(); return;
        }
        if(b.dataset.acct){ draft.acct=b.dataset.acct; renderPay(); return; }
        if(b.dataset.w){
          var cash=cashWallet();
          if(cash&&b.dataset.w===cash.id){ draft.pay='cash'; draft.acct=null; }
          else { draft.pay='transfer'; draft.acct=b.dataset.w; }
          renderPay();
        }
      });
      amtEl.addEventListener('input',function(){
        var digits=amtEl.value.replace(/[^0-9]/g,'').slice(0,11);
        draft.amount=digits?parseInt(digits,10):0;
        amtEl.value=draft.amount?fmt(draft.amount):'';
      });
      wrap.querySelector('.chips').addEventListener('click',function(e){
        var b=e.target.closest('button'); if(!b) return;
        if(b.dataset.add){ draft.amount=Math.min(draft.amount+parseInt(b.dataset.add,10),99999999999); }
        else if(b.dataset.clear){ draft.amount=0; }
        else return;
        amtEl.value=draft.amount?fmt(draft.amount):'';
      });
      var dateDispEl=wrap.querySelector('#dateDisp');
      dateEl.addEventListener('change',function(){
        if(!dateEl.value) return;
        draft.date=dateEl.value;
        dateDispEl.textContent=dateDisp(draft.date);
      });
      wrap.querySelector('.day-quick').addEventListener('click',function(e){
        var b=e.target.closest('button[data-day]'); if(!b) return;
        var d=new Date(); if(b.dataset.day==='yesterday') d.setDate(d.getDate()-1);
        var s=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
        draft.date=s; dateEl.value=s; wrap.querySelector('#dateDisp').textContent=dateDisp(s);
      });
      var del=wrap.querySelector('#delBtn');
      if(del) del.addEventListener('click',function(){
        var idx=state.items.findIndex(function(x){return x.id===draft.id;});
        if(idx<0){ closeSheet(); return; }
        var removed=state.items.splice(idx,1)[0];
        keepScrollY=window.scrollY;
        save(); closeSheet(); render();
        toast('삭제했어요','되돌리기',function(){ state.items.push(removed); save(); render(); });
      });
      wrap.querySelector('#saveBtn').addEventListener('click',function(){
        if(!draft.amount||draft.amount<=0){
          toast('금액을 먼저 적어주세요 💸');
          amtEl.focus(); return;
        }
        var d=dateEl.value||draft.date;
        var memo=wrap.querySelector('#memoInput').value.trim().slice(0,60);
        var wasEdit=!!draft.id;
        var sameMonth=(d.slice(0,7)===view.month);
        var rec;
        if(draft.type==='transfer'){
          if(!walletById(draft.from)||!walletById(draft.to)||draft.from===draft.to){
            toast('보낸 곳과 받은 곳을 다르게 골라주세요 🔄'); return;
          }
          rec={date:d,type:'transfer',amount:draft.amount,cat:'',walletId:null,payMethod:null,
               fromWalletId:draft.from,toWalletId:draft.to,memo:memo};
        }else{
          var cats=state.cats[draft.type];
          var cat=cats.some(function(c){return c.id===draft.cat;})?draft.cat:(cats[0]||{}).id;
          var wOut=resolvePay();
          rec={date:d,type:draft.type,amount:draft.amount,cat:cat,walletId:wOut.walletId,payMethod:wOut.payMethod,
               fromWalletId:null,toWalletId:null,memo:memo};
        }
        if(wasEdit&&sameMonth) keepScrollY=window.scrollY;
        if(wasEdit){
          var target=state.items.find(function(x){return x.id===draft.id;});
          if(target){ target.date=rec.date; target.type=rec.type; target.amount=rec.amount; target.cat=rec.cat;
            target.walletId=rec.walletId; target.payMethod=rec.payMethod;
            target.fromWalletId=rec.fromWalletId; target.toWalletId=rec.toWalletId; target.memo=rec.memo; }
        }else{
          rec.id=uid(); rec.createdAt=Date.now(); state.items.push(rec);
        }
        save();
        view.month=d.slice(0,7);
        closeSheet(); render();
        if(!wasEdit) window.scrollTo(0,0);
        toast(wasEdit?'고쳤어요 ✨':(rec.type==='transfer'?'옮긴 걸 기록했어요 🔄':'저장했어요 🐷'));
      });
    }
  );
}

/* ── wallet sheets: 💵 현금 · 🏦 계좌 세부 항목 ── */
var wDraft=null;
function amtBoxHTML(id,val,label){
  return '<div class="amt-box"><input id="'+id+'" class="amt" type="text" inputmode="numeric" autocomplete="off" placeholder="0" aria-label="'+esc(label)+'" value="'+(val?fmt(val):'')+'"><span class="w">원</span></div>';
}
function bindAmt(el,apply){
  el.addEventListener('input',function(){
    var neg=/^\s*-/.test(el.value);
    var digits=el.value.replace(/[^0-9]/g,'').slice(0,11);
    var n=digits?parseInt(digits,10):0;
    var v=neg?-n:n;
    apply(v);
    el.value=v?fmt(v):'';
  });
}
function incSwitchHTML(on){
  return '<div class="switch-row">'+
    '<span class="switch-txt"><b>전체 현재 잔액에 포함</b>'+
      '<small>끄면 맨 위 \'전체 현재 잔액\' 합계에서 빠지고 이 항목 잔액만 따로 보여요</small></span>'+
    '<button type="button" class="switch'+(on?' on':'')+'" id="incSwitch" role="switch" aria-checked="'+(on?'true':'false')+'" aria-label="전체 현재 잔액에 포함"><b></b></button>'+
  '</div>';
}
function bindIncSwitch(wrap){
  var sw=wrap.querySelector('#incSwitch'); if(!sw) return;
  sw.addEventListener('click',function(){
    wDraft.include=!wDraft.include;
    sw.classList.toggle('on',wDraft.include);
    sw.setAttribute('aria-checked',wDraft.include?'true':'false');
  });
}
function openCashSheet(){
  var w=cashWallet(); if(!w) return;
  wDraft={id:w.id,bal:walletBal(w),include:isInTotal(w)};
  openSheet(
    '<div class="sheet-head"><h2>💵 현금 잔액 맞추기</h2><button class="xbtn" data-close>✕</button></div>'+
    '<label class="field-label" for="cashBal">지금 가진 현금</label>'+
    amtBoxHTML('cashBal',wDraft.bal,'현금 잔액')+
    '<p class="hint">지금 지갑에 있는 현금을 적으면, 그 뒤 생기는 수입·지출만큼 <b>자동으로 바뀌어요</b>.</p>'+
    incSwitchHTML(wDraft.include)+
    '<div class="sheet-actions"><button type="button" class="btn-primary" id="cashSave">저장하기</button></div>',
    function(wrap){
      wrap.querySelector('[data-close]').addEventListener('click',function(){ closeSheet(); });
      var balEl=wrap.querySelector('#cashBal');
      bindAmt(balEl,function(v){ wDraft.bal=v; });
      bindIncSwitch(wrap);
      wrap.querySelector('#cashSave').addEventListener('click',function(){
        var w2=cashWallet(); if(!w2){ closeSheet(); return; }
        w2.initialBalance=Math.round(wDraft.bal-walletNet(w2.id));
        w2.includeInTotal=!!wDraft.include;
        save(); closeSheet(); render(); toast('현금 잔액을 맞췄어요 ✨');
      });
    }
  );
}
function openWalletSheet(id){
  var w=id?walletById(id):null;
  if(w&&w.group!=='bank'){ openCashSheet(); return; }
  var isNew=!w;
  var cur=w?walletBal(w):0;
  var banks=bankWallets();
  wDraft={id:w?w.id:null,emoji:w?w.emoji:'🏦',name:w?w.name:'',bal:cur,include:w?isInTotal(w):true};
  var canDel=!!w&&banks.length>1;
  openSheet(
    '<div class="sheet-head"><h2>'+(isNew?'계좌 세부 항목 추가':'세부 계좌 고치기')+'</h2><button class="xbtn" data-close>✕</button></div>'+
    '<div class="wallet-edit">'+
      '<input class="wemo" id="wEmoji" maxlength="8" value="'+esc(wDraft.emoji)+'" aria-label="이모지">'+
      '<input class="wnm" id="wName" maxlength="10" value="'+esc(wDraft.name)+'" placeholder="예) 국민은행 · 비상금" aria-label="이름">'+
    '</div>'+
    '<label class="field-label" for="wBal">'+(w?'지금 이 계좌의 잔액':'지금 이 계좌에 있는 돈')+'</label>'+
    amtBoxHTML('wBal',cur,'계좌 잔액')+
    '<p class="hint">예) <b>국민은행</b> · <b>카카오뱅크</b> · <b>비상금</b>처럼 나눠 두면 계좌별 잔액을 따로 볼 수 있어요.</p>'+
    incSwitchHTML(wDraft.include)+
    '<div class="sheet-actions">'+
      (canDel?'<button type="button" class="btn-del" id="wDel">삭제</button>':'')+
      '<button type="button" class="btn-primary" id="wSave">'+(isNew?'추가하기':'저장하기')+'</button>'+
    '</div>'+
    (canDel?'<p class="menu-note">지우면 이 항목의 기록·잔액은 다른 계좌로 옮겨져요.</p>':''),
    function(wrap){
      wrap.querySelector('[data-close]').addEventListener('click',function(){ closeSheet(); });
      var balEl=wrap.querySelector('#wBal');
      bindAmt(balEl,function(v){ wDraft.bal=v; });
      bindIncSwitch(wrap);
      wrap.querySelector('#wSave').addEventListener('click',function(){
        var name=wrap.querySelector('#wName').value.trim().slice(0,10);
        var emoji=wrap.querySelector('#wEmoji').value.trim().slice(0,8)||'🏦';
        if(!name){ toast('이름을 적어주세요 ✏️'); wrap.querySelector('#wName').focus(); return; }
        if(isNew){
          state.wallets.push({id:uid(),group:'bank',name:name,emoji:emoji,initialBalance:Math.round(wDraft.bal),includeInTotal:!!wDraft.include});
        }else{
          var w2=walletById(wDraft.id);
          if(!w2){ closeSheet(); return; }
          w2.name=name; w2.emoji=emoji; w2.includeInTotal=!!wDraft.include;
          // 지금 잔액을 그대로 보이게: initialBalance = 입력한 잔액 - (수입-지출)
          w2.initialBalance=Math.round(wDraft.bal-walletNet(w2.id));
        }
        save(); closeSheet(); render();
        toast(isNew?'계좌 세부 항목을 추가했어요 🏦':'계좌 정보를 저장했어요 ✨');
      });
      var del=wrap.querySelector('#wDel');
      if(del) del.addEventListener('click',function(){
        var w2=walletById(wDraft.id); if(!w2) return;
        var rest=bankWallets().filter(function(x){return x.id!==w2.id;});
        if(!rest.length){ toast('계좌 항목은 하나 이상 있어야 해요 🐷'); return; }
        var target=rest.find(function(x){return x.id==='bank';})||rest[0];
        var moved=state.items.filter(function(it){
          return it.type==='transfer'?(it.fromWalletId===w2.id||it.toWalletId===w2.id):(it.walletId===w2.id);
        }).length;
        var msg='\''+w2.name+'\' 계좌를 지울까요?'+
          (moved?'\n이 계좌의 기록 '+moved+'건과 잔액은 \''+target.name+'\'(으)로 옮겨져요.':'\n잔액도 함께 사라져요.');
        if(!confirm(msg)) return;
        state.items.forEach(function(it){
          if(it.type==='transfer'){
            if(it.fromWalletId===w2.id) it.fromWalletId=target.id;
            if(it.toWalletId===w2.id) it.toWalletId=target.id;
          }else if(it.walletId===w2.id) it.walletId=target.id;
        });
        // 이동 기록의 보낸 곳·받은 곳이 같아지면 의미가 없으니 지운다
        state.items=state.items.filter(function(it){ return !(it.type==='transfer'&&it.fromWalletId===it.toWalletId); });
        target.initialBalance=Math.round(Number(target.initialBalance)||0)+Math.round(Number(w2.initialBalance)||0);
        state.wallets=state.wallets.filter(function(x){return x.id!==w2.id;});
        if(view.filter==='w:'+w2.id) view.filter='all';
        save(); closeSheet(); render();
        toast('\''+w2.name+'\' 계좌를 지웠어요');
      });
    }
  );
}

/* ── category editor ────────────────────── */
var catDraft=null, catTab='expense';
function catRowsHTML(){
  var list=catDraft[catTab];
  return list.map(function(c,idx){
    return '<div class="cat-row" data-idx="'+idx+'">'+
      '<button type="button" class="grip" data-grip="'+idx+'" aria-label="'+esc(c.name)+' 순서 바꾸기 — 꾹 눌러 위아래로" title="꾹 눌러 위아래로 움직이면 순서가 바뀌어요">⠿</button>'+
      '<input class="emo" maxlength="8" value="'+esc(c.emoji)+'" aria-label="이모지">'+
      '<input class="nm" maxlength="14" value="'+esc(c.name)+'" aria-label="카테고리 이름">'+
      '<button type="button" class="rm" data-rm="'+idx+'"'+(list.length<=1?' disabled':'')+' aria-label="삭제">✕</button>'+
    '</div>';
  }).join('');
}
/* 순서를 바꾸면 즉시 저장: state.cats 순서를 지금 초안 순서에 맞춰 바로 반영한다.
   (기록 추가 화면의 카테고리 그리드도 state.cats 순서를 그대로 쓴다) */
function syncCatOrder(type){
  var want={};
  catDraft[type].forEach(function(c,i){ want[c.id]=i; });
  var base=state.cats[type]||[];
  var shared=base.filter(function(c){ return want[c.id]!==undefined; })
    .sort(function(a,b){ return want[a.id]-want[b.id]; });
  var k=0;
  state.cats[type]=base.map(function(c){
    return want[c.id]!==undefined ? shared[k++] : c;
  });
}

/* 꾹 눌러 위아래로 끌어 순서 바꾸기 (Pointer Events + 롱프레스) */
var catDrag=null, catPress=null, catDragLock=false;
function catRowEls(listEl){ return Array.prototype.slice.call(listEl.querySelectorAll('.cat-row')); }
function catMeasure(listEl){
  var lr=listEl.getBoundingClientRect();
  return catRowEls(listEl).map(function(el){
    var rc=el.getBoundingClientRect();
    return {el:el, top:rc.top-lr.top, h:rc.height};
  });
}
function catSheetOf(el){
  var p=el;
  while(p){ if(p.classList&&p.classList.contains('sheet')) return p; p=p.parentNode; }
  return null;
}
function catCancelPress(){
  if(!catPress) return;
  clearTimeout(catPress.timer);
  if(catPress.row) catPress.row.classList.remove('press-armed');
  catPress=null;
}
function catAbort(){
  catCancelPress();
  if(catDrag){
    if(catDrag.raf) cancelAnimationFrame(catDrag.raf);
    catDrag=null;
  }
}
function catBeginDrag(press){
  var listEl=press.listEl, m=catMeasure(listEl), s=press.idx;
  catCancelPress();
  if(!m[s]||catDrag) return;
  catDrag={
    listEl:listEl, m:m, s:s, row:m[s].el, pid:press.pid,
    startY:press.y, lastY:press.y,
    scroll:press.scroll||catSheetOf(listEl), startScroll:0,
    dy:0, target:s, drop:0, raf:0, sp:0
  };
  catDrag.startScroll=catDrag.scroll?catDrag.scroll.scrollTop:0;
  catDrag.maxScroll=catDrag.scroll?Math.max(0,catDrag.scroll.scrollHeight-catDrag.scroll.clientHeight):0;
  m[s].el.classList.add('dragging');
  m[s].el.style.transform='translateY(0px) scale(1.02)';
  listEl.classList.add('is-dragging');
  try{ if(navigator.vibrate) navigator.vibrate(8); }catch(e){}
  catDragMove(press.y);
}
function catDragMove(clientY){
  var d=catDrag; if(!d) return;
  d.lastY=clientY;
  var sd=d.scroll?(d.scroll.scrollTop-d.startScroll):0;
  d.dy=(clientY-d.startY)+sd;
  d.row.style.transform='translateY('+d.dy+'px) scale(1.02)';
  catDragLayout();
  catDragAutoScroll();
}
/* 행 높이를 재어 두고, 끌고 있는 행의 가운데가 어느 행의 가운데를 지나면
   그 자리로 자리를 비켜 주도록 나머지 행을 transform 으로 밀어 둔다. */
function catDragLayout(){
  var d=catDrag, m=d.m, n=m.length, s=d.s;
  var gap=(n>1)?Math.max(0,m[1].top-(m[0].top+m[0].h)):0;
  var center=m[s].top+m[s].h/2+d.dy;
  var t=0, j;
  for(j=0;j<n;j++){ if(j!==s && m[j].top+m[j].h/2<center) t++; }
  var others=[];
  for(j=0;j<n;j++){ if(j!==s) others.push(j); }
  var cur=m[0].top, drop=m[s].top;
  for(var i=0;i<=others.length;i++){
    if(i===t){ drop=cur; cur+=m[s].h+gap; }
    if(i<others.length){
      var k=others[i];
      var off=cur-m[k].top;
      m[k].el.style.transform=Math.abs(off)>0.4?('translateY('+off+'px)'):'translateY(0px)';
      cur+=m[k].h+gap;
    }
  }
  d.target=t;
  d.drop=drop-m[s].top;
}
/* 목록 위/아래 가장자리로 끌면 자동으로 스크롤 */
function catDragAutoScroll(){
  var d=catDrag; if(!d||!d.scroll) return;
  var sc=d.scroll, r=sc.getBoundingClientRect(), y=d.lastY, edge=74, sp=0;
  var vv=window.visualViewport;
  var topEdge=r.top, botEdge=r.bottom;
  if(vv){ topEdge=Math.max(topEdge,vv.offsetTop); botEdge=Math.min(botEdge,vv.offsetTop+vv.height); }
  if(y<topEdge+edge) sp=-Math.ceil(Math.min(14,Math.max(3,(topEdge+edge-y)/4)));
  else if(y>botEdge-edge) sp=Math.ceil(Math.min(14,Math.max(3,(y-(botEdge-edge))/4)));
  d.sp=sp;
  if(!sp){ if(d.raf){ cancelAnimationFrame(d.raf); d.raf=0; } return; }
  if(d.raf) return;
  d.raf=requestAnimationFrame(function step(){
    var dd=catDrag; if(!dd){ return; }
    var before=dd.scroll.scrollTop;
    /* 끌고 있는 행의 transform 이 스크롤 영역을 늘리므로, 처음 잰 실제 끝까지만 */
    dd.scroll.scrollTop=Math.max(0,Math.min(dd.maxScroll,before+dd.sp));
    if(dd.scroll.scrollTop===before){ dd.raf=0; return; }
    catDragMove(dd.lastY);
    dd.raf=requestAnimationFrame(step);
  });
}
function catDragFinish(){
  var d=catDrag; if(!d) return;
  catDrag=null;
  if(d.raf) cancelAnimationFrame(d.raf);
  d.listEl.classList.remove('is-dragging');
  catDragLock=true;
  setTimeout(function(){ catDragLock=false; },260);
  var row=d.row;
  row.style.transition='transform .19s cubic-bezier(.2,.8,.3,1)';
  row.style.transform='translateY('+(d.drop||0)+'px) scale(1)';
  setTimeout(function(){
    row.style.transition=''; row.style.transform='';
    row.classList.remove('dragging');
    var arr=catDraft[catTab];
    if(d.target!==d.s&&arr.length>d.s){
      var moved=arr.splice(d.s,1)[0];
      arr.splice(Math.max(0,Math.min(d.target,arr.length)),0,moved);
      syncCatOrder(catTab); save();
    }
    catRerenderList(d.target);
  },200);
}
function catRerenderList(flashIdx){
  var wrap=sheetEl; if(!wrap) return;
  var listEl=wrap.querySelector('#catList'); if(!listEl) return;
  var sc=wrap.querySelector('.sheet'), top=sc?sc.scrollTop:0;
  listEl.innerHTML=catRowsHTML();
  if(sc) sc.scrollTop=top;
  if(flashIdx!=null){
    var row=listEl.querySelector('.cat-row[data-idx="'+flashIdx+'"]');
    if(row){ row.classList.add('mv-flash'); setTimeout(function(){ row.classList.remove('mv-flash'); },620); }
  }
}
function catPointerDown(e){
  if(catDrag||catDragLock) return;
  if(e.button!==undefined&&e.button!==0) return;
  var t=e.target;
  if(!t||!t.closest) return;
  if(t.closest('input,textarea,select,.rm,#catAdd,.sheet-actions,.sheet-head,.xbtn')) return;
  var row=t.closest('.cat-row'); if(!row) return;
  var listEl=row.closest('#catList'); if(!listEl) return;
  var grip=!!t.closest('.grip');
  catCancelPress();
  var press={pid:e.pointerId, x:e.clientX, y:e.clientY, idx:Number(row.dataset.idx),
             row:row, listEl:listEl, grip:grip, scroll:catSheetOf(listEl), timer:0};
  catPress=press;
  if(grip){
    row.classList.add('press-armed');
    try{ e.preventDefault(); }catch(err){}
  }
  press.timer=setTimeout(function(){
    if(catPress!==press) return;
    catBeginDrag(press);
  }, grip?140:280);
}
function catPointerMove(e){
  if(catPress&&e.pointerId===catPress.pid&&!catDrag){
    var p=catPress, dx=e.clientX-p.x, dy=e.clientY-p.y, dist=dx*dx+dy*dy;
    if(p.grip){ if(dist>36) catBeginDrag(p); }
    else if(dist>100) catCancelPress();
    if(!catDrag) return;
  }
  if(!catDrag||e.pointerId!==catDrag.pid) return;
  if(e.cancelable) e.preventDefault();
  catDragMove(e.clientY);
}
function catPointerUp(e){
  if(catPress&&e.pointerId===catPress.pid) catCancelPress();
  if(catDrag&&e.pointerId===catDrag.pid) catDragFinish();
}
function catKeyMove(e){
  var g=e.target.closest&&e.target.closest('.grip'); if(!g) return;
  var d=e.key==='ArrowUp'?-1:(e.key==='ArrowDown'?1:0);
  if(!d) return;
  e.preventDefault();
  var row=g.closest('.cat-row'), listEl=row.closest('#catList');
  var i=Number(row.dataset.idx), j=i+d, arr=catDraft[catTab];
  if(j<0||j>=arr.length) return;
  var tmp=arr[i]; arr[i]=arr[j]; arr[j]=tmp;
  syncCatOrder(catTab); save();
  catRerenderList(j);
  var nb=listEl&&listEl.querySelector('.cat-row[data-idx="'+j+'"] .grip');
  if(nb){ try{ nb.focus({preventScroll:true}); }catch(err){ try{ nb.focus(); }catch(e2){} } }
}
window.addEventListener('pointermove',catPointerMove,{passive:false});
window.addEventListener('pointerup',catPointerUp);
window.addEventListener('pointercancel',catPointerUp);

function openCatSheet(){
  catDraft=JSON.parse(JSON.stringify(state.cats));
  catTab='expense';
  openSheet(
    '<div class="sheet-head"><h2>카테고리 편집</h2><button class="xbtn" data-close>✕</button></div>'+
    '<div class="seg" id="catSeg"><button type="button" data-t="expense" class="on">💸 지출</button><button type="button" data-t="income">💵 수입</button></div>'+
    '<div id="catList">'+catRowsHTML()+'</div>'+
    '<form class="cat-add" id="catAdd">'+
      '<input class="e" id="newEmoji" maxlength="8" placeholder="🍩" aria-label="새 이모지">'+
      '<input class="n" id="newName" maxlength="14" placeholder="새 카테고리 이름" aria-label="새 카테고리 이름">'+
      '<button type="submit">추가</button>'+
    '</form>'+
    '<div class="sheet-actions"><button type="button" class="btn-ghost" data-close>취소</button><button type="button" class="btn-primary" id="catSave">저장</button></div>'+
    '<p class="menu-note">⠿ 손잡이를 꾹 누른 채 위아래로 움직이면 순서가 바로 바뀌어요.<br>바뀐 순서는 바로 저장되고, 기록 화면에도 그대로 나와요. 지운 카테고리에 있던 기록은 같은 종류의 <b>기타</b>로 옮겨져요.</p>',
    function(wrap){
      $$('[data-close]',wrap).forEach(function(b){ b.addEventListener('click',function(){ closeSheet(); }); });
      var listEl=wrap.querySelector('#catList');
      var scroller=wrap.querySelector('.sheet');
      /* 드래그 중에는 뒷 배경(모달)이 같이 스크롤되지 않게 */
      if(scroller) scroller.addEventListener('touchmove',function(e){
        if(catDrag&&e.cancelable) e.preventDefault();
      },{passive:false});
      listEl.addEventListener('pointerdown',catPointerDown);
      listEl.addEventListener('keydown',catKeyMove);
      listEl.addEventListener('contextmenu',function(e){ if(catDrag||catPress) e.preventDefault(); });
      wrap.querySelector('#catSeg').addEventListener('click',function(e){
        var b=e.target.closest('button[data-t]'); if(!b) return;
        catTab=b.dataset.t;
        $$('#catSeg button',wrap).forEach(function(x){x.classList.toggle('on',x.dataset.t===catTab);});
        listEl.innerHTML=catRowsHTML();
      });
      listEl.addEventListener('input',function(e){
        var row=e.target.closest('.cat-row'); if(!row) return;
        var idx=Number(row.dataset.idx);
        if(e.target.classList.contains('emo')) catDraft[catTab][idx].emoji=e.target.value.slice(0,8);
        if(e.target.classList.contains('nm')) catDraft[catTab][idx].name=e.target.value.slice(0,14);
      });
      listEl.addEventListener('click',function(e){
        var b=e.target.closest('[data-rm]'); if(!b||b.disabled) return;
        var idx=Number(b.dataset.rm);
        catDraft[catTab].splice(idx,1);
        listEl.innerHTML=catRowsHTML();
      });
      wrap.querySelector('#catAdd').addEventListener('submit',function(e){
        e.preventDefault();
        var em=wrap.querySelector('#newEmoji').value.trim();
        var nm=wrap.querySelector('#newName').value.trim();
        if(!nm){ toast('이름을 적어주세요 ✏️'); wrap.querySelector('#newName').focus(); return; }
        catDraft[catTab].push({id:uid(),name:nm.slice(0,14),emoji:em||'🎁',color:PALETTE[(catDraft[catTab].length+2)%PALETTE.length]});
        wrap.querySelector('#newEmoji').value=''; wrap.querySelector('#newName').value='';
        listEl.innerHTML=catRowsHTML();
        listEl.lastElementChild.scrollIntoView({block:'nearest'});
      });
      wrap.querySelector('#catSave').addEventListener('click',function(){
        ['expense','income'].forEach(function(t){
          catDraft[t]=catDraft[t].filter(function(c){return String(c.name||'').trim()!=='' || c.emoji;});
          if(!catDraft[t].length) catDraft[t]=defaultCats()[t];
          catDraft[t].forEach(function(c){ c.name=String(c.name||'이름없음').trim().slice(0,14)||'이름없음'; c.emoji=String(c.emoji||'🎁'); });
        });
        state.cats=catDraft;
        // 옮겨 담기: 사라진 카테고리의 기록은 같은 종류의 '기타'로
        state.items.forEach(function(it){
          var list=(it.type==='transfer')?null:state.cats[it.type];
          if(!list) return;
          if(!list.some(function(c){return c.id===it.cat;})){
            var etc=list.find(function(c){return c.name.indexOf('기타')>-1;})||list[list.length-1];
            it.cat=etc.id;
          }
        });
        save(); closeSheet(); render(); toast('카테고리를 저장했어요 🏷️');
      });
    }
  );
}
